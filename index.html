<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>幼兒3C鑑定事務所</title>

<style>

/* ===== 基本設定 ===== */

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5e6b8;
    color: #333;
}

.page {
    display: none;
    min-height: 100vh;
    padding: 30px;
    box-sizing: border-box;
    text-align: center;
}

.page.active {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}


/* ===== 歡迎畫面 ===== */

#welcome {
    background: #8ed4ed;
}

h1 {
    font-size: 45px;
    color: #e85d4a;
}

.welcome-text {
    font-size: 28px;
    margin: 30px;
}


/* ===== 按鈕 ===== */

button {
    border: none;
    border-radius: 15px;
    padding: 18px 35px;
    margin: 10px;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

.start-button {
    background: #e85d4a;
    color: white;
}

.start-button:hover {
    background: #d94b3b;
}


/* ===== 個案畫面 ===== */

#casePage {
    background: #f5e6b8;
}

.case-box {
    width: min(900px, 90%);
    background: white;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.case-number {
    font-size: 22px;
    color: #888;
}

.case-info {
    font-size: 28px;
    line-height: 1.7;
    margin: 30px 0;
}


/* ===== 倒數 ===== */

.timer {
    font-size: 40px;
    font-weight: bold;
    color: #e85d4a;
    margin: 20px;
}


/* ===== 答案按鈕 ===== */

.answers {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.answer {
    width: 200px;
    color: white;
}

.red {
    background: #e95757;
}

.yellow {
    background: #e8c84b;
    color: #333;
}

.green {
    background: #59b96b;
}


/* ===== 統計圖 ===== */

#resultPage {
    background: #f5e6b8;
}

.result-box {
    width: min(800px, 90%);
    background: white;
    padding: 30px;
    border-radius: 25px;
}

.result-row {
    margin: 25px 0;
    text-align: left;
}

.result-label {
    font-size: 22px;
    font-weight: bold;
}

.bar-background {
    width: 100%;
    height: 40px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    transition: width 0.5s;
}

.red-bar {
    background: #e95757;
}

.yellow-bar {
    background: #e8c84b;
}

.green-bar {
    background: #59b96b;
}


/* ===== 手機版 ===== */

@media (max-width: 600px) {

    h1 {
        font-size: 32px;
    }

    .welcome-text {
        font-size: 22px;
    }

    .case-info {
        font-size: 21px;
    }

    .timer {
        font-size: 32px;
    }

    .answer {
        width: 90%;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     歡迎畫面
================================================== -->

<div id="welcome" class="page active">

    <h1>
        歡迎來到幼兒3C鑑定事務所
    </h1>

    <div class="welcome-text">
        👋 歡迎入職本事務所！
        <br><br>
        準備好開始今天的鑑定工作了嗎？
    </div>

    <button
        id="startButton"
        class="start-button"
    >
        🔨 開始上工
    </button>

</div>



<!-- ==================================================
     個案畫面
================================================== -->

<div id="casePage" class="page">

    <div class="case-box">

        <div
            id="caseNumber"
            class="case-number"
        >
            個案一
        </div>


        <h2>
            📋 個案資訊
        </h2>


        <div
            id="caseInfo"
            class="case-info"
        >
        </div>


        <div
            id="timer"
            class="timer"
        >
            30
        </div>


        <div>
            請選擇你認為最適合的答案：
        </div>


        <div class="answers">

            <button
                id="tooMuchButton"
                class="answer red"
            >
                🔴 太多了
            </button>


            <button
                id="okayButton"
                class="answer yellow"
            >
                🟡 還可以
            </button>


            <button
                id="goodButton"
                class="answer green"
            >
                🟢 完全喔虧
            </button>

        </div>

    </div>

</div>



<!-- ==================================================
     統計結果
================================================== -->

<div id="resultPage" class="page">

    <div class="result-box">

        <h1>
            📊 本題回答統計
        </h1>


        <div class="result-row">

            <div class="result-label">
                🔴 太多了：
                <span id="redCount">0</span> 人
            </div>

            <div class="bar-background">

                <div
                    id="redBar"
                    class="bar red-bar"
                ></div>

            </div>

        </div>



        <div class="result-row">

            <div class="result-label">
                🟡 還可以：
                <span id="yellowCount">0</span> 人
            </div>

            <div class="bar-background">

                <div
                    id="yellowBar"
                    class="bar yellow-bar"
                ></div>

            </div>

        </div>



        <div class="result-row">

            <div class="result-label">
                🟢 完全喔虧：
                <span id="greenCount">0</span> 人
            </div>

            <div class="bar-background">

                <div
                    id="greenBar"
                    class="bar green-bar"
                ></div>

            </div>

        </div>


        <button
            id="nextButton"
            class="start-button"
        >
            ➡️ 下一單
        </button>

    </div>

</div>

/* ==================================================
   遊戲變數
================================================== */

/* ==================================================
   每一題的票數
================================================== */

let redVotes = 0;

let yellowVotes = 0;

let greenVotes = 0;


/* ==================================================
   取得畫面
================================================== */

const welcome =
    document.getElementById("welcome");

const casePage =
    document.getElementById("casePage");

const resultPage =
    document.getElementById("resultPage");


/* ==================================================
   開始上工
================================================== */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    welcome.classList.remove("active");

    casePage.classList.add("active");

    showCase();

}


/* ==================================================
   顯示個案
================================================== */

function showCase() {

    clearInterval(timer);


    const current =
        cases[currentCase];


    document.getElementById(
        "caseNumber"
    ).textContent =
        "個案 " + (currentCase + 1);


    document.getElementById(
        "caseInfo"
    ).innerHTML =
        current.info;


    timeLeft =
        current.time;


    document.getElementById(
        "timer"
    ).textContent =
        timeLeft;


    /* 每一題重新計算票數 */

    redVotes = 0;

    yellowVotes = 0;

    greenVotes = 0;


    /* 開始倒數 */

    timer = setInterval(

        function() {

            timeLeft--;

            document.getElementById(
                "timer"
            ).textContent =
                timeLeft;


            if (timeLeft <= 0) {

                clearInterval(timer);

                showResult();

            }

        },

        1000

    );

}


/* ==================================================
   投票
================================================== */

document
    .getElementById("tooMuchButton")
    .addEventListener(
        "click",
        function() {

            redVotes++;

            disableButtons();

            showResult();

        }
    );


document
    .getElementById("okayButton")
    .addEventListener(
        "click",
        function() {

            yellowVotes++;

            disableButtons();

            showResult();

        }
    );


document
    .getElementById("goodButton")
    .addEventListener(
        "click",
        function() {

            greenVotes++;

            disableButtons();

            showResult();

        }
    );


/* ==================================================
   禁止重複投票
================================================== */

function disableButtons() {

    document.getElementById(
        "tooMuchButton"
    ).disabled = true;

    document.getElementById(
        "okayButton"
    ).disabled = true;

    document.getElementById(
        "goodButton"
    ).disabled = true;

}

   顯示統計
================================================== */
